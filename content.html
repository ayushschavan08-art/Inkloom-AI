
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content Review | Inkloom AI</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">Inkloom AI</div>

        <nav>
            <a href="./index.html">Dashboard</a>
            <a href="./guidelines.html">Brand Guidelines</a>
            <a href="./content.html" class="active">Content Review</a>
            <a href="./ai-analysis.html">AI Analysis</a>
        </nav>

        <div class="sidebar-bottom">
            AI-Powered Brand Governance
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="container">

            <h1>Content Review</h1>

            <p>
                Check your content for brand consistency using Inkloom AI.
            </p>

            <!-- CONTENT SUBMISSION -->
            <div class="review-box">

                <h2>Submit Your Content</h2>

                <label for="content">Enter your content:</label>

                <textarea
                    id="content"
                    rows="8"
                    placeholder="Paste your advertisement, social media post, or other content here..."
                ></textarea>

                <button id="checkBtn" type="button">
                    Check Content
                </button>

            </div>

            <!-- ANALYSIS RESULTS -->
            <div id="result" aria-live="polite">

                <h2>Analysis Results</h2>

                <p>Your AI analysis results will appear here.</p>

            </div>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="./Script.js" defer></script>

</body>
</html>
