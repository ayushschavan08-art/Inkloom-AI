<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content Review | Inkloom AI</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <h1>Content Review</h1>

        <p>Check your content for brand consistency using Inkloom AI.</p>

        <div class="review-box">

            <h2>Submit Your Content</h2>

            <label for="content">Enter your content:</label>

            <textarea id="content" rows="8"
                placeholder="Paste your advertisement, social media post, or other content here..."></textarea>

            <button id="checkBtn">Check Content</button>

        </div>

        <div id="result">

            <h2>Analysis Results</h2>

            <p>Your AI analysis results will appear here.</p>

        </div>

        <a href="index.html">← Back to Dashboard</a>

    </div>
    <script>
const checkBtn = document.getElementById("checkBtn");

checkBtn.addEventListener("click", async function () {

    const content = document.getElementById("content").value;
    const resultDiv = document.getElementById("result");

    if (!content.trim()) {
        resultDiv.innerHTML = "Please enter some content first.";
        return;
    }

    resultDiv.innerHTML = "Analysing your content...";

    try {
        const response = await fetch(
            "https://inkloom-ai-mknr.onrender.com/api/content-submission",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    content: content
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Backend request failed");
        }

        resultDiv.innerHTML = `
            <h3>Analysis Results</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
        `;

    } catch (error) {
        console.error("Backend Error:", error);
        resultDiv.innerHTML =
            "Backend connection failed: " + error.message;
    }
});
</script>

</body>
</html>

    <script src="Script.js"></script>

</body>
</html>
